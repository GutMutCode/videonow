photocraft-ui-egui = { path = "engines/photo/crates/ui-egui" }
photocraft-vector = { path = "engines/photo/crates/vector" }
# external
arc-swap = "1"
boa_engine = { version = "0.22", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.16"
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719" }
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
criterion = { version = "0.5", default-features = false }
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = { version = "0.36" }
exr = "1.74"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
gif = "0.14"
harfrust = { version = "0.12", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kurbo = { version = "0.13", features = ["serde"] }
log = { version = "0.4" }
pollster = "0.4"
proptest = { version = "1" }
rayon = { version = "1" }
rfd = { version = "0.17" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
sys-locale = "0.3"
thiserror = { version = "2" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }
web-time = "1"
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-h264enc]
opt-level = 3

[profile.dev.package.filmcraft-hevc]
opt-level = 3

