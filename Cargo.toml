[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "engines/film/crates/*", "engines/effect/crates/*", "engines/photo/crates/*"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/GutMutCode/videonow"

[workspace.dependencies]
# videonow
videonow-core = { path = "crates/videonow-core" }
videonow-automation = { path = "crates/videonow-automation" }
videonow-cli = { path = "apps/videonow-cli" }
# engines (vendored once, developed here from now on)
effectcraft-automation = { path = "engines/effect/crates/automation" }
effectcraft-av1enc = { path = "engines/effect/crates/av1enc" }
effectcraft-color = { path = "engines/effect/crates/color" }
effectcraft-effects = { path = "engines/effect/crates/effects" }
effectcraft-engine = { path = "engines/effect/crates/engine" }
effectcraft-export = { path = "engines/effect/crates/export" }
effectcraft-expr = { path = "engines/effect/crates/expr" }
effectcraft-geom = { path = "engines/effect/crates/geom" }
effectcraft-gpu = { path = "engines/effect/crates/gpu" }
effectcraft-hevcenc = { path = "engines/effect/crates/hevcenc" }
effectcraft-host = { path = "engines/effect/crates/host" }
effectcraft-interchange = { path = "engines/effect/crates/interchange" }
effectcraft-keyframe = { path = "engines/effect/crates/keyframe" }
effectcraft-lottie = { path = "engines/effect/crates/lottie" }
effectcraft-media = { path = "engines/effect/crates/media" }
