[package]
name = "videonow-desktop"
description = "VideoNow desktop application: one window, three editors (timeline, motion, image), one project"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "videonow-desktop"
path = "src/main.rs"

[dependencies]
videonow-core = { workspace = true }
videonow-automation = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-engine = { workspace = true }
effectcraft-ui-egui = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-project = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-io = { workspace = true }
photocraft-format = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
image = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
open = "5"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
